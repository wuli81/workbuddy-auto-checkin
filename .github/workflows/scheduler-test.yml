name: Scheduler Minimal Test

on:
  schedule:
    # Temporary diagnostic: every 5 minutes, offset from common boundaries
    - cron: '1,6,11,16,21,26,31,36,41,46,51,56 * * * *'
  workflow_dispatch:

jobs:
  scheduler-test:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger
        run: |
          echo "event=$GITHUB_EVENT_NAME"
          echo "run_id=$GITHUB_RUN_ID"
          date -u
